name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://radar:radar@localhost:5432/radar
      TEST_DATABASE_URL: postgresql+psycopg://radar:radar@localhost:5432/radar_test
      LLM_PROVIDER: none
      APP_ENV: development
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check radar tests
      - run: uv run pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx next typegen   # PageProps/LayoutProps route types (normally generated by dev/build)
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # The public site serves the bundled verified snapshot: prove it builds and renders with no backend at all.
      - name: Build the public site (verified snapshot, no backend)
        run: npx next build
        env:
          DATA_SOURCE: snapshot
      - name: Smoke-test the public site with no backend running
        env:
          DATA_SOURCE: snapshot
        run: |
          npx next start -p 3100 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3100/ && break; sleep 1; done
          for p in / /demo /video /formation /formation/person-sameh-khamis /meet /founders/kevin-zakka \
                   /companies/shengshu /reports/a89e4ce9-2cc8-4a75-a2e1-752565e09141 "/search?q=vllm" /status /api/proxy/home; do
            code=$(curl -s -o /tmp/page -w "%{http_code}" "http://localhost:3100$p")
            if [ "$code" != 200 ] || grep -qiE "could not load|returned an error|signal lost|not_in_snapshot" /tmp/page; then
              echo "::error::$p -> HTTP $code"; cat /tmp/next.log | tail -20; exit 1
            fi
            echo "ok $p"
          done
          if grep -q "⨯" /tmp/next.log; then echo "::error::server render errors"; cat /tmp/next.log; exit 1; fi
