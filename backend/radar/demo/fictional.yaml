papers:
  - {id: "demo.2609.11873", title: "TactileVLA: Vision-Language-Action Policies with Dense Tactile Tokens", days_ago: 19, categories: [cs.RO, cs.LG], authors: [mira-okafor, dev-raman, ana-lindqvist, kenji-sato], code: demo-halcyon/tactile-vla, company: halcyon,
     abstract: "We introduce TactileVLA, a vision-language-action policy that consumes high-resolution tactile images as tokens alongside RGB. Across 14 contact-rich industrial assembly tasks, tactile tokens improve success on insertion and cable routing by 31 points over vision-only baselines. Code and a GPU tactile simulator are released."}
  - {id: "demo.2608.07311", title: "Tessel: Tile-Level Autotuning Across Heterogeneous Accelerators", days_ago: 28, categories: [cs.DC, cs.AR, cs.PL], authors: [priya-natarajan, jonas-weber], code: demo-tessellate/tessel, company: tessellate,
     abstract: "Tessel lowers PyTorch graphs to a tile-level IR and autotunes schedules per accelerator, reaching 0.82–1.04× of vendor-tuned kernels on three non-NVIDIA targets without hand-written kernels."}
  - {id: "demo.2608.01994", title: "Millisecond Equilibrium Reconstruction for Compact Stellarators", days_ago: 48, categories: [physics.plasm-ph], authors: [lena-ostrowski], company: perihelion,
     abstract: "A learned surrogate for equilibrium reconstruction that runs in 1.3 ms on a single FPGA, enabling closed-loop shape control in compact stellarator configurations."}
  - {id: "demo.2609.04420", title: "Real-Time Island Detection from Sparse Magnetic Diagnostics", days_ago: 27, categories: [physics.plasm-ph, eess.SY], authors: [lena-ostrowski], company: perihelion,
     abstract: "We detect magnetic island formation from sparse pickup-coil data with a lightweight sequence model, giving 40 ms of warning before confinement degradation."}
  - {id: "demo.2609.15502", title: "Closed-Loop Coil Current Control for Stellarator Shaping", days_ago: 6, categories: [physics.plasm-ph, eess.SY], authors: [lena-ostrowski], company: perihelion,
     abstract: "A model-predictive controller for modular coil currents that holds target rotational transform profiles within 2% under perturbation."}
  - {id: "demo.2608.03117", title: "DreamGrid: Latent World Models as Robot Policy Evaluators", days_ago: 58, categories: [cs.RO, cs.LG], authors: [elias-brandt], code: demo-ebrandt/dreamgrid,
     abstract: "We show that latent world models trained on 40k hours of teleoperation can rank robot policies with 0.91 Spearman correlation to real-world success."}
  - {id: "demo.2609.02284", title: "Scaling Laws for Action-Conditioned Video World Models", days_ago: 31, categories: [cs.LG, cs.CV], authors: [elias-brandt], code: demo-ebrandt/dreamgrid,
     abstract: "We measure how action-conditioned world model fidelity scales with data and parameters, finding a data-limited regime for contact-rich manipulation."}
  - {id: "demo.2609.16630", title: "World Models Need Contact: Failure Modes in Manipulation Rollouts", days_ago: 5, categories: [cs.RO], authors: [elias-brandt], code: demo-ebrandt/dreamgrid,
     abstract: "We catalogue systematic failure modes of video world models in contact-rich rollouts and propose a tactile-augmented latent that halves rollout divergence."}
