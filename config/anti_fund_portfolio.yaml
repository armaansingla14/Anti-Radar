# Publicly disclosed Anti Fund portfolio companies monitored by Portfolio Pulse (public mode).
#
# Honesty rules (enforced by radar/portfolio/config.py):
# - Only companies that Anti Fund itself lists publicly, at the source below. Stage and year are copied exactly as
#   that page states them; anything the page does not state stays unknown. Nothing private is stored here: no
#   ownership, cost basis, marks, reserves, board or internal fields (the loader rejects them).
# - Identifiers are included only when verified by hand on 2026-11-06:
#     website loads; GitHub org is linked from the company's site or points back to its domain;
#     careers board is linked from the site, or every posting names the company.
#   Unverified look-alikes are deliberately left out (noted in comments) so another organisation is never monitored
#   under a portfolio company's name.
# - usaspending_recipient is the exact recipient name of awards that clearly belong to the company; name-only
#   matches are never fuzzy.
# - Comps are judgement (epistemic INFERENCE). Each has a type, a one-line reason grounded in what the comp says it
#   does, and the public page that shows the overlap.
#
# Selection: the technical companies (AI, robotics, defense, energy, semiconductors, space, frontier infrastructure)
# with enough public footprint to monitor. Consumer, fintech and acquired positions are not monitored in this
# public demo (off-thesis for technical monitoring, or no longer independent); the full list is on the source page.

