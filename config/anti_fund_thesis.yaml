  max_results_per_category: 40

# Where people previously worked → founder signal tier.
# tier_1 = frontier labs / exceptional technical orgs. tier_2 = strong technical orgs.
affiliation_tiers:
  tier_1: [OpenAI, Anthropic, DeepMind, Google DeepMind, Meta FAIR, FAIR, NVIDIA, Tesla, SpaceX, Anduril, Palantir, Physical Intelligence, Figure, Cognition, Anysphere, Cursor, Boston Dynamics, Waymo, Skild, xAI, Google Brain, Toyota Research Institute, MIT, Stanford, Berkeley, UC Berkeley, CMU, Carnegie Mellon, ETH Zurich, Caltech]
  tier_2: [Google, Microsoft, Apple, Amazon, Meta, AMD, Intel, Qualcomm, Cruise, Zoox, Aurora, Nuro, Hugging Face, Mistral, Cohere, Databricks, Stripe, Lockheed Martin, Northrop Grumman, Raytheon, Blue Origin, Rocket Lab, Commonwealth Fusion, Helion, TAE, Princeton, Harvard, Oxford, Cambridge, Georgia Tech, University of Washington, UIUC, Michigan, Toronto, Mila, Max Planck]

# Language that suggests founding activity (used on bios, posts, READMEs).
formation_phrases:
  - working on something new
  - starting something
  - building something new
  - stealth
  - we're hiring
  - founding engineer
  - founding team
  - just left
  - excited to share what we've been building
  - finally sharing
  - launching
  - co-founder
  - cofounder
  - day 1 at

# Technical role taxonomy for the hiring signal engine.
hiring_roles:
  ml_research: [research scientist, research engineer, machine learning, ml engineer, applied scientist, ai researcher]
  robotics_controls: [controls engineer, robotics engineer, motion planning, manipulation, perception engineer, mechatronics]
  embedded_firmware: [embedded, firmware, fpga engineer, hardware engineer, electrical engineer]
  silicon: [asic, rtl, verification engineer, physical design, silicon, chip architect, analog design]
  gpu_compiler: [gpu kernel, cuda, compiler engineer, performance engineer, mlir, kernel engineer]
  rf_defense: [rf engineer, electronic warfare, radar engineer, signal processing, guidance navigation, gnc]
  energy_plasma: [plasma, nuclear engineer, power electronics, thermal engineer, fusion]
  manufacturing: [manufacturing engineer, process engineer, production engineer, quality engineer, supply chain]
  infra: [infrastructure engineer, site reliability, distributed systems, platform engineer, backend engineer]
  gtm: [sales, account executive, marketing, business development, customer success, recruiter]

# Scoring constants. SCORE_VERSION is bumped by code when formulas change.
scoring:
  weights:
    technical_momentum: 25
    founder_signal: 20
    acceleration: 20
    thesis_fit: 15
    novelty: 10
    attention_gap: 10
  collision:
    window_days: 42
    decay_days: 21
    independence_bonus: 0.5
    tight_span_days: 14
    tight_span_multiplier: 1.2
    saturation: 2.0
  novelty:
    half_life_days: 45
  attention_gap:
    flag_tech_min: 0.75
    flag_attention_max: 0.40
    low_coverage_penalty: 0.7
  cohort_min: 12
  feedback:
    step: 0.05
    min_multiplier: 0.8
    max_multiplier: 1.2
    max_point_shift: 10
