# Organization alias map used to normalize free-text, self-reported affiliations
# (GitHub profile "company", arXiv affiliations, personal sites).
#
# canonical name -> list of aliases. Matching is case-insensitive and ignores
# punctuation, a leading "@", and legal suffixes (Inc, LLC, Ltd, Corp).
# The raw string is always kept next to the normalized one (Person.attrs['affiliations_normalized']);
# normalization never changes what a person actually wrote.
#
# Keep aliases unambiguous: a bare word that is also an ordinary English word
# ("meta", "fair") is only matched when it is the *entire* affiliation string.

