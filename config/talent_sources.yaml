# ─────────────────────────────────────────────────────────────────────────────
# ANTI RADAR — TALENT POOL sources
#
# People with VERIFIED public technical history at frontier labs / frontier OSS:
# non-bot contributors with >= `min_commits` commits to the repositories below
# (counts and first/last commit weeks come from the GitHub API).
#
# Honesty rules (enforced in code, restated here):
#   * "contributed N commits to org/repo" is a verified fact; it is NEVER employment.
#     Employment stays INFERRED / self-reported (GitHub profile company field).
#   * A new repository or a new org is not a company: POSSIBLE FORMATION language only.
#
# tier 1 = frontier AI / robotics / systems labs and the core frontier OSS projects;
# tier 2 = strong but broader communities (large OSS ecosystems, academic labs, hardware OSS).
# `repos` lists explicit repositories (no docs/website/cookbook repos); without it the
# provider takes the org's top non-fork, non-archived repos by stars.
# Every org login below was verified to exist via GET /users/{login} (2026-10-20);
# `openhwgroup` was dropped (its repositories moved; the org has no code repos left).
# ─────────────────────────────────────────────────────────────────────────────

limits:
  repos_per_org: 3            # used when an org has no explicit `repos`
  contributors_per_repo: 15   # top non-bot contributors per repo (by commits)
  min_commits: 10             # verified history threshold
  max_people: 450             # whole-pool person budget per talent_pool run
  new_repo_window_days: 120   # new_project: repos created this recently
  young_org_days: 180         # joined_young_org: orgs created this recently
  orgs_per_run: 4             # talent_pool orgs refreshed per sweep run (4 runs/day -> full cycle in ~2 days)
  refresh_days: 7             # an org's contributor list is refreshed at most weekly
  activity_people_per_run: 300  # recent_activity checks per run (oldest-checked first)
  activity_recheck_hours: 20  # people checked more recently than this are skipped (daily cadence)

